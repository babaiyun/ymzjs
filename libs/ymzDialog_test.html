<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ymzDialog v1.12.0 Test</title>
    <style>
        body{font-family:Arial,sans-serif;padding:24px;line-height:1.6}
        button{margin:4px;padding:8px 14px}
        #test-result{margin-top:20px;padding:14px;background:#f6f6f6;white-space:pre-wrap}
        .pass{color:#16803a}
        .fail{color:#c62828}
    </style>
</head>
<body>

<h1>ymzDialog v1.12.0 Test Demo</h1>

<div>
    <button id="btn-alert">Alert</button>
    <button id="btn-confirm">Confirm</button>
    <button id="btn-prompt">Prompt</button>
    <button id="btn-custom">Custom</button>
</div>

<div id="manual-result"></div>
<div id="test-result">自动测试准备中...</div>


<script src="./ymzBase.js"></script>
<script src="./ymzDialog.js"></script>

<script>
(function(){
    'use strict';

    var manualResult =document.getElementById('manual-result');

    document.getElementById('btn-alert').onclick =function(){
        ymzDialog.alert('这是 Alert 测试').then(function(value){
            manualResult.textContent ='Alert 返回: ' + value;
        });
    };

    document.getElementById('btn-confirm').onclick =function(){
        ymzDialog.confirm('确定继续吗？').then(function(value){
            manualResult.textContent ='Confirm 返回: ' + value;
        });
    };

    document.getElementById('btn-prompt').onclick =function(){
        ymzDialog.prompt('请输入名称：', {
            value:'Ken',
            validate:function(value){
                return value.trim() === '' ? '名称不能为空' : true;
            }
        }).then(function(value){
            manualResult.textContent ='Prompt 返回: ' + value;
        });
    };

    document.getElementById('btn-custom').onclick =function(){
        ymzDialog.open({
            title:'自定义 Dialog',
            content:'<b>支持 HTML 内容</b><br>也可以使用 contentText 安全文本。',
            width:560,
            closeOnMask:true,
            buttons:[
                {
                    text:'取消',
                    value:'cancel'
                },
                {
                    text:'完成',
                    value:'done',
                    primary:true
                }
            ]
        }).promise.then(function(value){
            manualResult.textContent ='Custom 返回: ' + value;
        });
    };
}());
</script>

<script>
(function(){
    'use strict';

    var resultElem =document.getElementById('test-result'),
        pass =0,
        fail =0,
        lines =[];

    function assert(name, stat){
        if(stat){
            pass++;
            lines.push('PASS  ' + name);
        }else{
            fail++;
            lines.push('FAIL  ' + name);
        }
    }

    function wait(ms){
        return new Promise(function(resolve){
            setTimeout(resolve, ms || 0);
        });
    }

    async function run(){
        var controller, value, first, second, oldController, mask, input;

        assert('ymzDialog exists', !!window.ymzDialog);
        assert('initial isOpen false', ymzDialog.isOpen() === false);

        controller =ymzDialog.open({
            title:'基础测试',
            contentText:'<b>安全文本</b>',
            buttons:[
                {text:'OK', value:123, primary:true}
            ]
        });

        assert('open returns controller', !!controller && !!controller.promise);
        assert('isOpen true after open', ymzDialog.isOpen() === true);
        assert('current returns dialog element', ymzDialog.current() === controller.elem);
        assert('contentText does not render HTML', controller.body.innerHTML.indexOf('&lt;b&gt;') !== -1);
        assert('role=dialog', controller.elem.getAttribute('role') === 'dialog');
        assert('aria-modal=true', controller.elem.getAttribute('aria-modal') === 'true');

        controller.elem.querySelector('.primary').click();
        value =await controller.promise;

        assert('button resolves configured value', value === 123);
        assert('closed after button click', ymzDialog.isOpen() === false);

        first =ymzDialog.open({
            title:'First',
            cancelValue:'first-cancel'
        });

        oldController =first;

        second =ymzDialog.open({
            title:'Second'
        });

        value =await first.promise;

        assert('opening new dialog closes old with old cancelValue', value === 'first-cancel');
        assert('second remains open', ymzDialog.current() === second.elem);
        assert('stale controller cannot close newer dialog', oldController.close('wrong') === false);
        assert('newer dialog still open after stale close', ymzDialog.current() === second.elem);

        second.close('second-ok');
        value =await second.promise;

        assert('scoped controller close returns own value', value === 'second-ok');

        controller =ymzDialog.open({
            title:'ESC',
            cancelValue:'esc-value'
        });

        document.dispatchEvent(
            new KeyboardEvent('keydown', {
                key:'Escape',
                keyCode:27,
                bubbles:true
            })
        );

        value =await controller.promise;
        assert('ESC returns cancelValue', value === 'esc-value');

        controller =ymzDialog.open({
            title:'Mask',
            cancelValue:'mask-value',
            closeOnMask:true
        });

        mask =controller.elem.parentNode;
        mask.dispatchEvent(new MouseEvent('click', {bubbles:true}));
        value =await controller.promise;

        assert('mask click returns cancelValue', value === 'mask-value');

        controller =ymzDialog.open({
            title:'HTML',
            content:'<strong id="html-test">HTML</strong>'
        });

        assert('content supports HTML by default', !!controller.body.querySelector('#html-test'));
        controller.close();

        value =await ymzDialog.alert('Alert');
        assert('alert OK returns true', value === true);

        var confirmPromise =ymzDialog.confirm('Confirm');
        ymzDialog.current().querySelector('.ymz-dialog-btn').click();
        value =await confirmPromise;

        assert('confirm cancel returns false', value === false);

        var promptPromise =ymzDialog.prompt('Prompt', {
            value:'old',
            validate:function(v){
                return v === '' ? '不能为空' : true;
            }
        });

        input =ymzDialog.current().querySelector('.ymz-dialog-input');
        assert('prompt input focused', document.activeElement === input);

        input.value ='new-value';
        ymzDialog.current().querySelector('.primary').click();
        value =await promptPromise;

        assert('prompt returns input value', value === 'new-value');

        var invalidPromise =ymzDialog.prompt('Validate', {
            value:'',
            validate:function(v){
                return v === '' ? false : true;
            }
        });

        input =ymzDialog.current().querySelector('.ymz-dialog-input');
        ymzDialog.current().querySelector('.primary').click();

        await wait();

        assert('prompt validate=false keeps dialog open', ymzDialog.isOpen() === true);

        input.value ='ok';
        ymzDialog.current().querySelector('.primary').click();
        value =await invalidPromise;

        assert('prompt can submit after validation passes', value === 'ok');

        assert(
            'style only injected once',
            document.querySelectorAll('#ymz_dialog_style').length === 1
        );

        controller =ymzDialog.open({
            title:'Close API'
        });

        assert('global close returns true when open', ymzDialog.close('global') === true);
        value =await controller.promise;

        assert('global close resolves value', value === 'global');
        assert('global close returns false when closed', ymzDialog.close() === false);

        resultElem.className =fail === 0 ? 'pass' : 'fail';
        resultElem.textContent =
            lines.join('\n') +
            '\n\nRESULT: ' +
            pass +
            ' passed, ' +
            fail +
            ' failed';

        document.documentElement.setAttribute(
            'data-test-result',
            fail === 0 ? 'PASS' : 'FAIL'
        );
    }

    run().catch(function(error){
        resultElem.className ='fail';
        resultElem.textContent ='TEST ERROR\n' + (error.stack || error);
        document.documentElement.setAttribute('data-test-result', 'ERROR');
    });
}());
</script>

</body>
</html>
