<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>ymzImage v1.1.0 Test Demo</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            padding:24px;
            line-height:1.6;
        }

        #layout-image{
            display:block;
            width:120px;
            height:60px;
        }

        #test-result{
            margin-top:20px;
            padding:16px;
            background:#f5f5f5;
            white-space:pre-wrap;
        }

        .pass{
            color:#16803a;
        }

        .fail{
            color:#c62828;
        }
    </style>
</head>
<body>

<h1>ymzImage v1.1.0 Test Demo</h1>

<p>此 Demo 自动测试尺寸读取、缓存、动态 CSS、加载成功/失败和批量等待。</p>

<img id="layout-image" alt="">
<div id="image-list"></div>

<div id="test-result">测试执行中...</div>

<script>
/*
 * Demo 内置最小 ymzBase，只用于单文件独立测试。
 * 正式项目请使用现有 ymzBase。
 */
(function(global){
    'use strict';

    if(global.ymzBase) return;

    var doc =global.document,
        slice =Array.prototype.slice;

    function getRoot(root){
        if(root == null) return doc;
        if(typeof root === 'string') return doc.querySelector(root);
        return root;
    }

    global.ymzBase ={
        queryElem:function(elem, root){
            if(typeof elem !== 'string'){
                return elem || null;
            }

            var base =getRoot(root);

            return base
                ? base.querySelector(elem)
                : null;
        },

        queryAll:function(selector, root){
            var base =getRoot(root);

            return base
                ? slice.call(base.querySelectorAll(selector))
                : [];
        },

        toArray:function(value){
            if(value == null) return [];
            if(Array.isArray(value)) return value.slice();

            if(
                typeof value !== 'string' &&
                typeof value.length === 'number'
            ){
                return slice.call(value);
            }

            return [value];
        }
    };
}(window));
</script>

<script src="./ymzImage_v1.1.0.js"></script>

<script>
(function(){
    'use strict';

    var resultElem =document.getElementById('test-result'),
        listElem =document.getElementById('image-list'),
        pass =0,
        fail =0,
        lines =[],
        svgData ='data:image/svg+xml;charset=utf-8,' +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20">' +
                '<rect width="40" height="20" fill="red"/>' +
                '</svg>'
            );

    function check(name, stat){
        if(stat){
            pass++;
            lines.push('PASS  ' + name);
        }else{
            fail++;
            lines.push('FAIL  ' + name);
        }
    }

    function near(a, b){
        return Math.abs(a - b) < 0.01;
    }

    async function run(){
        var image,
            size,
            size2,
            result,
            results,
            layoutImage =document.getElementById('layout-image');

        check('ymzImage exists', !!window.ymzImage);
        check('getSize invalid returns null', ymzImage.getSize(null) === null);
        check('clearSize invalid returns false', ymzImage.clearSize(null) === false);
        check('isReady invalid returns false', ymzImage.isReady(null) === false);

        size =ymzImage.getSize(layoutImage);

        check(
            'layout fallback returns current CSS size',
            size &&
            size.width === 120 &&
            size.height === 60
        );

        layoutImage.style.width ='200px';
        layoutImage.style.height ='100px';

        size2 =ymzImage.getSize(layoutImage);

        check(
            'layout size is not stale-cached',
            size2 &&
            size2.width === 200 &&
            size2.height === 100
        );

        check(
            'allowLayoutSize=false ignores previous layout result',
            ymzImage.getSize(layoutImage, false) === null
        );

        layoutImage.setAttribute('width', '100%');
        layoutImage.setAttribute('height', '50%');

        size =ymzImage.getSize(layoutImage);

        check(
            'percent HTML attributes are not treated as px',
            size &&
            size.width === 200 &&
            size.height === 100
        );

        layoutImage.removeAttribute('width');
        layoutImage.removeAttribute('height');

        image =document.createElement('img');
        image.src =svgData;
        listElem.appendChild(image);

        result =await ymzImage.wait(image);

        check('wait loaded image succeeds', result.loaded === true);
        check('isReady true after load', ymzImage.isReady(image) === true);

        size =ymzImage.getSize(image);

        check(
            'natural size is 40x20',
            size &&
            size.width === 40 &&
            size.height === 20 &&
            size.ratio === 2
        );

        image.setAttribute('width', '100');

        size =ymzImage.getSize(image);

        check(
            'single width attribute derives height from natural ratio',
            size &&
            near(size.width, 100) &&
            near(size.height, 50)
        );

        size.width =999;
        size2 =ymzImage.getSize(image);

        check(
            'caller mutation does not corrupt cached size',
            near(size2.width, 100) &&
            near(size2.height, 50)
        );

        image.setAttribute('height', '80');

        size =ymzImage.getSize(image);

        check(
            'both HTML dimensions take priority',
            size &&
            size.width === 100 &&
            size.height === 80
        );

        check('clearSize valid image returns true', ymzImage.clearSize(image) === true);

        var broken =document.createElement('img');
        broken.src ='data:image/not-valid;base64,AAAA';
        listElem.appendChild(broken);

        result =await ymzImage.wait(broken);

        check(
            'broken image resolves loaded=false',
            result.loaded === false &&
            result.size === null
        );

        result =await ymzImage.wait(null);

        check(
            'wait invalid input resolves safe result',
            result.image === null &&
            result.loaded === false &&
            result.size === null
        );

        var image2 =document.createElement('img');
        image2.className ='batch-image';
        image2.src =svgData;

        var broken2 =document.createElement('img');
        broken2.className ='batch-image';
        broken2.src ='data:image/not-valid;base64,BBBB';

        listElem.appendChild(image2);
        listElem.appendChild(broken2);

        results =await ymzImage.waitAll('.batch-image', listElem);

        check('waitAll keeps result count', results.length === 2);
        check(
            'waitAll keeps source order',
            results[0].image === image2 &&
            results[1].image === broken2
        );
        check(
            'waitAll contains success and failure independently',
            results[0].loaded === true &&
            results[1].loaded === false
        );

        resultElem.className =fail === 0
            ? 'pass'
            : 'fail';

        resultElem.textContent =
            lines.join('\n') +
            '\n\nRESULT: ' +
            pass +
            ' passed, ' +
            fail +
            ' failed';

        document.documentElement.setAttribute(
            'data-test-result',
            fail === 0
                ? 'PASS'
                : 'FAIL'
        );
    }

    run().catch(function(error){
        resultElem.className ='fail';
        resultElem.textContent =
            'TEST ERROR\n' +
            (error.stack || error);

        document.documentElement.setAttribute(
            'data-test-result',
            'ERROR'
        );
    });
}());
</script>

</body>
</html>
